<style>

600}.technique p{margin:8px 0 2px}.previous{background:#eef1eb;border-radius:11px;padding:12px 14px;margin:15px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:12px}.previous strong{display:block;color:var(--green);margin-bottom:3px}.previous .previous-text{flex:1;min-width:0;overflow-wrap:anywhere}.previous p{margin:0;white-space:pre-wrap}.sets-head,.set-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 52px;gap:10px;align-items:center}.sets-head{font-size:11px;color:var(--muted);text-align:center;padding:0 0 7px}.set-row{padding:6px 0;border-top:1px solid #eeeee6}.set-row input[type=number]{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}.set-row.done{color:var(--green)}.set-row.done input[type=number]{background:#f0f5ed;border-color:#cbd9ca}.set-number{text-align:center;font:italic 17px Georgia,serif;color:var(--muted)}.check-label{display:grid;place-items:center;min-height:44px;cursor:pointer}.set-actions{display:flex;gap:8px;margin:11px 0 18px}.note-grid{display:grid;grid-template-columns:1fr 120px;gap:12px}.note-grid textarea,.note-grid select{margin-top:5px}.cardio-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}.cardio-grid input{margin-top:5px}.cardio-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.cardio-head h3{margin:0}.cardio textarea{margin-top:5px}.field-space{margin-top:12px}.empty{padding:45px 20px;text-align:center}.empty h2{margin-bottom:12px}.session-note{margin-bottom:22px}.finish-bar{position:fixed;bottom:0;left:0;right:0;z-index:7;border-top:1px solid #d8d9cb;background:#f4f0e7f7;backdrop-filter:blur(12px);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}.finish-inner{display:flex;align-items:center;gap:12px}.finish-meta{flex:1;min-width:0;font-size:13px}.finish-meta strong{display:block}.finish-inner button{min-height:49px}.history-tools{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}.history-tools label{flex:1}.history-tools input{margin-top:5px}.history-card{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.history-card h3{margin-bottom:5px}.history-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-block;font-size:11px;color:var(--red);border:1px solid #e3c8b8;padding:2px 8px;border-radius:20px;margin-bottom:10px}.backup-actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.privacy{font-size:14px}.privacy li{margin-bottom:9px}ol,ul{padding-left:21px}.file-label{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:10px 15px;color:var(--ink);font-size:16px;cursor:pointer;background:white}.rules{font-size:14px}.rules li{margin-bottom:9px}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:30;background:var(--ink);color:white;border-radius:12px;padding:12px 20px;max-width:90vw;font-size:14px;box-shadow:0 6px 22px #0002;overflow-wrap:anywhere}.storage-alert{position:relative;z-index:12;background:#fae2d8;border-bottom:1px solid #ca8c75;padding:12px 20px;font-size:13px;color:#7a2a18}.storage-alert button{margin:5px 6px 0 0}dialog{border:1px solid var(--line);border-radius:22px;padding:0;max-width:760px;width:calc(100% - 28px);max-height:85dvh;background:var(--white);color:var(--ink)}dialog::backdrop{background:#0f253a8a;backdrop-filter:blur(3px)}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:0;background:var(--white)}.modal-head h2{font-size:21px;margin:0}.modal-body{padding:22px}.record-exercise{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.record-exercise p{font-size:14px;margin-bottom:7px;white-space:pre-wrap;overflow-wrap:anywhere}.record-exercise h3{font-size:17px}.record-set{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}.footer-note{text-align:center;color:var(--muted);font-size:11px;margin:25px 0}.hidden-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.long-text{white-space:pre-wrap;overflow-wrap:anywhere}.inline-error{font-size:13px;color:#a93830;margin-top:12px}.tab-intro{font-size:14px;margin-top:-8px}.summary-count{font-family:Georgia,serif;font-size:46px;color:var(--red);line-height:1.2}.recovery{display:flex;gap:10px;align-items:flex-start}.recovery input{flex:0 0 22px;margin-top:3px}
@media(min-width:800px){.exercise-list{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.exercise-list .card{margin:0}.exercise-list{margin-bottom:22px}.hero{padding-top:48px}.setup-grid{grid-template-columns:1fr 1.6fr}.wrap{padding-left:30px;padding-right:30px}.history-card{padding:25px}.finish-inner{max-width:1040px}}
@media(max-width:500px){.wrap{padding:0 15px}.hero{padding-top:27px;padding-bottom:22px}.hero-mark{flex-basis:78px;height:78px;font-size:48px}.hero-mark:before{width:94px}.hero-mark:after{font-size:6px;bottom:5px;letter-spacing:1px}.eyebrow{font-size:9px;letter-spacing:2px;margin-bottom:10px}.hero p{font-size:12px}.panel,.card{padding:18px;border-radius:17px}.setup-grid{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.note-grid{grid-template-columns:1fr 95px}.sets-head,.set-row{gap:7px;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 42px}.week-strip{gap:2px}.week-strip span{font-size:9px}.week-strip span b{font-size:11px}.cardio-grid{grid-template-columns:1fr 1fr}.cardio-grid label:first-child{grid-column:1/-1}.history-card{display:block}.history-actions{margin-top:14px;justify-content:flex-start}.finish-inner{gap:7px}.finish-inner button{padding:10px 12px;font-size:14px}.finish-meta{font-size:12px}.previous{padding:11px;gap:7px}.previous button{max-width:85px;font-size:12px}nav button{font-size:13px;padding:9px 5px}.modal-body{padding:17px}}

<body>
<div id="storageAlert" class="storage-alert" role="alert" hidden></div>
<header class="hero"><div class="wrap hero-inner"><div><div class="eyebrow">TRAINING JOURNAL / VOL. 01</div><h1>训练手记<span style="color:var(--red)">.</span></h1><p>把重量写下来，让进步有迹可循。<br>五日力量 · 减脂保肌 · 记录每一次</p></div><div class="hero-mark" aria-hidden="true">05</div></div></header>
<div class="nav-shell"><div class="wrap"><nav aria-label="主导航"><button data-view="training" class="active">今日训练</button><button data-view="history">历史记录</button><button data-view="backup">备份与说明</button></nav></div></div>
<main class="wrap"><section id="trainingView"></section><section id="historyView" hidden></section><section id="backupView" hidden></section><p class="footer-note">CONSISTENCY OVER INTENSITY · 稳定训练，不必每次练到极限</p></main>
<div id="finishBar" class="finish-bar" hidden><div class="wrap finish-inner"><div class="finish-meta"><strong id="finishCount">尚未完成组数</strong><span id="finishHint" class="muted">重量口径要一致</span></div><button id="addCardio" type="button">＋ 有氧</button><button id="finish" type="button" class="accent">结束训练</button></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="recordDialog"><div class="modal-head"><h2>训练详情</h2><button id="closeDialog" aria-label="关闭详情">关闭</button></div><div id="recordBody" class="modal-body"></div></dialog>
<dialog id="actionDialog" aria-labelledby="actionTitle"><div class="modal-head"><h2 id="actionTitle">请确认</h2></div><div class="modal-body"><p id="actionMessage" class="long-text"></p><label id="actionInputLabel" hidden>动作名称<input id="actionInput" maxlength="300" autocomplete="off"></label><div class="backup-actions" style="justify-content:flex-end;margin-bottom:0"><button id="actionCancel" type="button">取消</button><button id="actionAccept" type="button" class="primary">确认</button></div></div></dialog>
<script>
'use strict';
const KEY='training-journal-v1', VERSION='five-day-2026-11-v1';
const BASES=['器械标示重量','杠铃总重（含杆）','单只哑铃重量','两只哑铃合计','辅助重量（越大越省力）','自重／不记录重量'];
const E=(id,name,sets,reps,muscle,cue,alternatives,basis=BASES[0],extra={})=>({id,name,sets,reps,muscle,cue,alternatives,basis,...extra});
const PLANS=[
{id:'mon',title:'周一 · 胸＋三头＋肩中束',short:'推 A',exercises:[
E('bench','杠铃平板卧推',4,'6～10','胸大肌；三头、肩前束辅助','肩胛稳定贴凳，脚踩稳；手腕与前臂对齐，不弹胸。使用安全杆或保护员。',['平板哑铃卧推','坐姿器械推胸'],BASES[1]),
E('incline-db','上斜哑铃卧推',3,'8～12','胸大肌锁骨部（上胸）；三头、肩前束辅助','凳背约15°～30°；下降到肩部舒适范围，不耸肩、不碰撞哑铃。',['上斜器械推胸','史密斯上斜卧推'],BASES[2]),
E('pec-deck','蝴蝶机夹胸',2,'12～15','胸大肌','座椅调至握把接近胸部高度；肘微屈，回程不过度拉到身后。',['龙门架夹胸']),
E('lateral-mon','哑铃侧平举',4,'12～20','三角肌中束','手臂略在身体前侧抬起，肘微屈；抬至接近肩高，不甩腰、不耸肩。',['绳索侧平举','器械侧平举'],BASES[2]),
E('overhead','绳索过顶臂屈伸',3,'10～15','肱三头肌，尤其长头','收紧腹部，肋骨不过度外翻；上臂相对固定，不靠挺腰推绳。',['坐姿哑铃过顶臂屈伸'])]},
{id:'tue',title:'周二 · 背＋二头＋肩后束',short:'拉 A',exercises:[
E('lat','高位下拉',4,'8～12','背阔肌、大圆肌；二头辅助','大腿压垫固定，身体轻微后倾；肘向下带动，拉到上胸附近，不做颈后下拉。选择一种舒服握法，不额外追加另一握法4组。',['辅助引体向上','器械高位下拉']),
E('t-row','胸托T杠划船',4,'8～12','背阔肌、菱形肌、斜方肌中部','胸部贴垫，不耸肩；回程受控，不用腰把胸顶离支撑垫。',['胸托划船机','上斜凳胸托哑铃划船']),
E('face-pull','绳索面拉',3,'12～20','肩后束、肩胛周围肌群及肩袖外旋肌群','滑轮约眼睛高度，绳拉向眉眼两侧；重量轻些，不后仰、不强拧肩。',['弹力带面拉','反向蝴蝶机'],BASES[0],{alternativeNote:'反向蝴蝶机主要替代后束训练，不能完全替代面拉的外旋部分。'}),
E('preacher','牧师凳弯举',3,'8～12','肱二头肌、肱肌','上臂贴垫，下降受控；底部不猛伸直肘，不抬肩借力。',['牧师凳弯举机','站姿绳索杠弯举'],BASES[1]),
E('hammer','哑铃锤式弯举',2,'10～15','肱肌、肱桡肌；二头参与','掌心相对，上臂靠近身体；不甩动，不把肘大幅向前送。',['绳索锤式弯举'],BASES[2])]},
{id:'wed',title:'周三 · 腿＋核心',short:'腿＋核心',exercises:[
E('squat','杠铃深蹲',4,'6～10','股四头肌、臀大肌；核心稳定','使用深蹲架安全杆；腹部撑紧、脚掌稳定，膝盖顺脚尖方向；蹲到能保持控制的深度。学习阶段可以先做3组。',['哈克深蹲机','史密斯深蹲'],BASES[1]),
E('leg-press','45°倒蹬机',3,'8～12','股四头肌、臀大肌','腰臀贴垫；下降到骨盆不卷起的位置，顶端不猛锁膝。',['水平腿举机','高脚杯深蹲']),
E('seated-curl','坐姿腿弯举',4,'10～15','腘绳肌（大腿后侧）','膝关节对齐器械转轴，大腿压垫固定；不抬臀，回程慢放。',['俯卧腿弯举','站姿单腿弯举机'],BASES[0],{alternativeNote:'站姿单腿弯举机按每侧完成次数，左右都做完算一组。'}),
E('calf','站姿或坐姿提踵',3,'12～20','小腿三头肌；站姿更侧重腓肠肌，坐姿更侧重比目鱼肌','前脚掌踩稳，脚跟充分但舒适地下放；顶端短暂停顿，不弹震。',['史密斯提踵','坐姿哑铃负重提踵'],BASES[0],{alternativeNote:'实际动作请选择站姿提踵或坐姿提踵，分别匹配历史。',actualChoices:['站姿提踵','坐姿提踵','史密斯提踵','坐姿哑铃负重提踵']}),
E('reverse-crunch','反向卷腹',3,'10～15','腹直肌，配合骨盆控制','呼气把骨盆轻轻卷离垫面，不只是甩腿；下降缓慢。',['死虫'],BASES[5],{alternativeNote:'死虫改为3×8～12/侧，偏核心稳定，并非完全同类刺激。'})]},
{id:'thu',title:'周四 · 胸＋肩＋三头',short:'推 B',exercises:[
E('incline-machine','上斜器械推胸',3,'8～12','上胸；三头、肩前束辅助','座椅调到握把与上胸大致对应；肩胛稳定贴垫，不耸肩、不猛锁肘。',['上斜哑铃卧推','史密斯上斜卧推']),
E('ohp','实力推（站姿杠铃肩推）',3,'6～10','三角肌前束、中束；三头辅助','臀腹收紧，不蹬腿借力；杠铃贴近面部通过，避免大幅后仰、腰部过伸。',['坐姿器械推肩','坐姿哑铃推肩'],BASES[1]),
E('cable-fly','龙门架夹胸',2,'12～15','胸大肌','滑轮约胸部高度；肘微屈且角度基本固定，不用身体前后摆动拉动重量。',['蝴蝶机夹胸']),

function updateProgress(){const s=db.draft;$('#finishBar').hidden=view!=='training'||!s;if(!s)return;const sets=s.exercises.flatMap(e=>e.sets),n=sets.filter(x=>x.done).length;const p=$('#progressFill');if(p)p.style.width=(sets.length?100*n/sets.length:0)+'%';if($('#progressText'))$('#progressText').textContent=`已完成 ${n} / ${sets.length} 组 · 有氧 ${s.cardio.length} 项`;$('#finishCount').textContent=`已完成 ${n} / ${sets.length} 组`;$('#finishHint').textContent=s.editingId?'保存后更新原历史记录':'本机记录 · 记得定期导出';$('#finish').textContent=s.editingId?'保存修改':'结束训练'}
function renderHistory(){const list=db.sessions.filter(s=>!historyDate||s.date===historyDate).sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt.localeCompare(a.updatedAt));$('#historyView').innerHTML=`<div class="topline"><span class="section-kicker">HISTORY / 训练档案</span><button class="small primary" data-action="new-session">＋ 新训练</button></div><h2>每一次，都有记录。</h2><p class="tab-intro muted">共 ${db.sessions.length} 次已结束训练，草稿保存在“今日训练”。</p><div class="history-tools"><label>按日期筛选<input id="historyDate" type="date" value="${historyDate}" aria-label="筛选历史日期"></label><button data-action="clear-filter">全部日期</button></div>${list.length?list.map(s=>{const n=s.exercises.flatMap(e=>e.sets).filter(x=>x.done).length;return `<article class="panel history-card"><div><span class="badge">${s.date}</span><h3>${esc(s.title)}</h3><p class="muted" style="font-size:13px;margin:0">${s.exercises.length}个力量动作 · 完成${n}组 · ${s.cardio.length}项有氧</p>${s.note?`<p class="hint long-text">${esc(s.note)}</p>`:''}</div><div class="history-actions"><button class="small" data-action="view-record" data-id="${esc(s.id)}">查看</button><button class="small" data-action="edit-record" data-id="${esc(s.id)}">编辑</button><button class="small danger" data-action="delete-record" data-id="${esc(s.id)}">删除</button></div></article>`}).join(''):'<div class="panel empty"><h3>这里还没有记录</h3><p class="muted">完成训练后点击“结束训练”，就会出现在这里。</p></div>'}`}
function renderBackup(){$('#backupView').innerHTML=`<div class="section-kicker">KEEP YOUR PROGRESS / 数据与使用说明</div><h2 style="margin-top:9px">记录属于你。</h2><div class="panel"><div class="summary-count">${db.sessions.length}<span style="font:14px sans-serif;color:var(--muted);margin-left:10px">次历史训练</span></div><p class="hint">${db.draft?'另有1份当前草稿。':'暂无草稿。'}导出JSON会一并保存草稿。</p><div class="backup-actions"><button class="primary" data-action="export-json">导出完整备份 JSON</button><button data-action="export-csv">导出逐组 CSV</button><label class="file-label" for="importFile">导入备份 JSON</label><input id="importFile" class="hidden-file" type="file" accept=".json,application/json"></div><p class="hint">建议每周备份一次。JSON用于完整恢复；CSV方便用Excel查看，不用于导入。</p></div><div class="panel privacy"><h3>先了解保存方式</h3><ul><li><strong>仅当前浏览器本机保存，不上传训练记录。</strong>本页面没有账号数据库，也不会自动跨设备同步。</li><li>换手机、换浏览器、清理网站数据，可能看不到原记录。无痕模式关闭后也可能清除数据。</li><li>本地HTML与在线网页是不同存储空间；两者之间请通过JSON备份迁移。iPhone“文件”或聊天软件的预览器不保证能执行HTML或保存数据，优先使用Safari打开在线地址。</li><li>网页程序公开访问，无需登录；训练记录仍仅保存在你当前浏览器，其他访问者看不到你的记录。</li><li>没有离线安装缓存；在线地址首次打开和重新加载需要网络。本地HTML在支持的浏览器里无需网络。</li><li>导入按训练ID合并，重复ID保留当前记录。已有草稿不会被导入草稿覆盖。</li></ul></div><div class="panel rules"><h3>训练与填写规则</h3><ol><li>每张卡片上方是原计划；下方是今天的实际记录。重量和次数可留空，填了就要使用非负数，次数使用正整数。</li><li>杠铃记录含杆总重，哑铃默认单只重量；辅助引体的辅助重量越大越省力。机器型号和座椅档位请写在备注中。</li><li>单侧动作按每侧填写次数，左右都完成才勾选一组。两侧重量不同，可以写在备注中。</li><li>上次记录仅匹配同动作名称和同重量口径，排除当前训练及未来日期。器械型号不同，即使名称相同也须重新选择重量。</li><li>复制上次会带入重量、次数、重量口径与备注，但不会勾选完成，也不会复制余力。</li><li>正常训练保留约2次余力；第一周恢复训练保留3～4次。热身组不计正式组。</li><li>复合动作休息2～3分钟，孤立动作60～90秒，核心45～60秒。完成计划就结束，不必为凑时间追加组数。</li><li>陌生动作让现场教练检查技术和安全设置。疼痛、胸闷、头晕或动作失控时停止；当前若仍明显失眠，先就诊和恢复睡眠。</li></ol></div><div class="panel"><h3>手机怎么用</h3><p class="privacy">在Safari打开在线地址，建议固定用同一个浏览器。可以在Safari菜单中选择“添加到主屏幕”（具体位置随系统版本变化）。若桌面入口与Safari显示的记录不同，请先从原入口导出JSON，再到新入口导入。</p><button data-action="download-html">下载独立HTML文件</button></div>`}
function setView(v){view=v;document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.view===v;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});$('#trainingView').hidden=v!=='training';$('#historyView').hidden=v!=='history';$('#backupView').hidden=v!=='backup';if(v==='training')renderTraining();if(v==='history')renderHistory();if(v==='backup')renderBackup();updateProgress();window.scrollTo({top:0,behavior:'instant'})}
async function startNew(){if(hasContent(db.draft)&&!await askConfirm('当前有未结束的草稿。新建将替换它，建议先结束训练或导出备份。仍要新建吗？'))return;db.draft=newSession(weekday(today()));persist();setView('training')}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportJSON(){download(`训练手记备份_${today()}.json`,JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json');notify('备份已生成，请确认文件已保存')}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['训练ID','日期','计划','记录状态','项目类型','实际动作','原计划动作','重量口径','组号','重量kg','实际次数','已完成','余力','动作备注','有氧分钟','有氧米数','整场备注']];for(const s of [...db.sessions,...(db.draft?[db.draft]:[])]){for(const e of s.exercises)e.sets.forEach((x,j)=>rows.push([s.id,s.date,s.title,s.status==='draft'?'草稿':'已结束','力量',e.actualName,e.template.name,e.basis,j+1,x.weight,x.reps,x.done?'是':'否',e.rir,e.note,'','',s.note]));for(const c of s.cardio)rows.push([s.id,s.date,s.title,s.status==='draft'?'草稿':'已结束','有氧',c.type,'','','','','','','',c.note,c.minutes,c.distance,s.note]);if(!s.exercises.length&&!s.cardio.length)rows.push([s.id,s.date,s.title,s.status==='draft'?'草稿':'已结束','休息','','','','','','','','','','','',s.note])}download(`训练手记逐组_${today()}.csv`,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV已生成，可用Excel打开')}
async function importJSON(file){try{assert(file&&file.size<=8*1024*1024,'请选择不超过8MB的JSON备份');const data=validateDB(JSON.parse(await file.text()));const ids=new Set(db.sessions.map(x=>x.id));const add=data.sessions.filter(x=>!ids.has(x.id)),skip=data.sessions.length-add.length;const takeDraft=(!db.draft||!hasContent(db.draft))&&data.draft;const msg=`备份包含 ${data.sessions.length} 次历史训练。\n新增 ${add.length} 次，重复 ${skip} 次（保留本机记录）。\n${data.draft?(takeDraft?'将恢复备份中的草稿。':'本机已有填写内容的草稿，导入草稿将跳过。'):'备份不含草稿。'}\n确认合并导入吗？`;if(!await askConfirm(msg))return;db.sessions.push(...add);if(takeDraft)db.draft=data.draft;const saved=persist();setView(view);notify(`已合并${add.length}次，跳过${skip}次重复。${saved?'':'本机保存失败，请导出！'}`)}catch(e){notify('导入失败：'+e.message)}finally{if($('#importFile'))$('#importFile').value=''}}
function showRecord(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;$('#recordBody').innerHTML=`<span class="badge">${s.date}</span><h2>${esc(s.title)}</h2>${s.note?`<p class="long-text">${esc(s.note)}</p>`:''}${s.exercises.map(e=>`<div class="record-exercise"><h3>${esc(e.actualName)}</h3><p class="muted">${esc(e.basis)} · 计划${e.template.sets}×${esc(e.template.reps)} · 余力${e.rir===''?'未记录':esc(e.rir)+'次'}</p>${e.sets.map((x,j)=>`<div class="record-set"><span>第${j+1}组</span><span>${esc(setString(x))}</span></div>`).join('')}${e.note?`<p style="margin-top:8px">备注：${esc(e.note)}</p>`:''}</div>`).join('')}${s.cardio.map(c=>`<div class="record-exercise"><h3>${esc(c.type||'有氧')}</h3><p>${c.minutes===''?'—':c.minutes}分钟 · ${c.distance===''?'—':c.distance}米</p><p>${esc(c.note)}</p></div>`).join('')}<button class="primary" data-action="edit-record" data-id="${esc(s.id)}">编辑这次训练</button>`;$('#recordDialog').showModal()}
async function finishSession(){const s=db.draft;if(!s)return;if(!$('#trainingView').querySelectorAll(':invalid').length){for(const e of s.exercises)if(!e.actualName.trim()||e.actualName==='自定义动作'){notify('请先填写自定义动作名称');return}if(!await askConfirm(s.editingId?'保存修改并更新这次历史训练吗？':'结束本次训练？未填写和未勾选的组也会保留，可在历史中修改。'))return;const record=clone(s);record.status='completed';record.editingId=null;record.updatedAt=new Date().toISOString();const idx=db.sessions.findIndex(x=>x.id===(s.editingId||s.id));if(idx>=0)db.sessions[idx]=record;else db.sessions.push(record);db.draft=null;const ok=persist();setView('history');notify(ok?'训练已记下，恢复也是训练的一部分。':'记录留在内存中，请立即导出备份！')}else{notify('请先修正红框中的数值');$('#trainingView').querySelector(':invalid')?.reportValidity()}}
function updatePrevious(i){const target=document.querySelector(`[data-previous="${i}"]`);if(target)target.innerHTML=previousHTML(db.draft.exercises[i],i)}
document.addEventListener('input',event=>{const el=event.target,s=db.draft;if(!s)return;const f=el.dataset.field;if(el.id==='sessionNote'){s.note=el.value;persist();return}if(!f||el.tagName==='SELECT'||el.type==='checkbox'||f==='actualName')return;if(!el.checkValidity()){document.querySelectorAll('.save-state').forEach(n=>{n.textContent='输入有误 · 当前值尚未保存';n.classList.add('fail')});return}if(el.dataset.c!==undefined){const c=s.cardio[+el.dataset.c];c[f]=['minutes','distance'].includes(f)?(el.value===''?'':Number(el.value)):el.value;persist();return}if(el.dataset.e!==undefined){const i=+el.dataset.e,e=s.exercises[i];if(el.dataset.s!==undefined)e.sets[+el.dataset.s][f]=el.value===''?'':Number(el.value);else if(f==='customName'){e.actualName=el.value;updatePrevious(i)}else e[f]=el.value;persist()}});
document.addEventListener('change',async event=>{const el=event.target,s=db.draft;if(el.id==='importFile'){if(el.files[0])importJSON(el.files[0]);return}if(el.id==='historyDate'){historyDate=el.value;renderHistory();return}if(!s)return;if(el.id==='sessionDate'){if(!validDate(el.value)){el.value=s.date;notify('请选择有效日期');return}s.date=el.value;persist();renderTraining();return}if(el.id==='planSelect'){if(hasContent(s)&&!await askConfirm('切换模板将替换当前草稿。请先结束训练或导出备份。仍要切换吗？')){el.value=s.planId;return}db.draft=newSession(el.value,s.date,s.recovery);persist();renderTraining();return}if(el.id==='recoveryToggle'){if(hasContent(s)&&!await askConfirm('调整恢复模式将重置各动作实际组数和组内记录，备注保留。确认吗？')){el.checked=s.recovery;return}s.recovery=el.checked;s.exercises.forEach(e=>e.sets=emptySets(s.recovery?Math.max(1,Math.ceil(e.template.sets/2)):e.template.sets));persist();renderTraining();return}if(el.dataset.e!==undefined){const i=+el.dataset.e,e=s.exercises[i],f=el.dataset.field;if(f==='actualName'){const name=el.value,dirty=e.note||e.rir!==''||e.sets.some(x=>x.weight!==''||x.reps!==''||x.done);if(dirty&&!await askConfirm('更换动作会清空这个动作的组内记录、备注和余力，避免把不同动作混在一起。确认更换吗？')){el.value=e.custom?'__custom__':e.actualName;return}e.custom=name==='__custom__';e.actualName=e.custom?'自定义动作':name;e.basis=defaultBasis(e.actualName);e.sets=emptySets(e.sets.length);e.note='';e.rir='';persist();renderTraining();return}if(f==='basis'){e.basis=el.value;persist();updatePrevious(i);return}if(f==='rir'){e.rir=el.value===''?'':Number(el.value);persist();return}if(f==='done'){e.sets[+el.dataset.s].done=el.checked;el.closest('.set-row').classList.toggle('done',el.checked);persist();updateProgress()}}});
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.view){setView(b.dataset.view);return}if(b.id==='closeDialog'){$('#recordDialog').close();return}if(b.id==='finish'){finishSession();return}const action=b.dataset.action||(b.id==='addCardio'?'add-cardio':'');const s=db.draft,i=+b.dataset.e,e=s?.exercises[i];switch(action){case'new-session':startNew();break;case'add-set':if(e.sets.length>=100){notify('单个动作最多记录100组');break}e.sets.push({weight:'',reps:'',done:false});persist();renderTraining();break;case'remove-set':{const x=e.sets.at(-1);if((x.weight!==''||x.reps!==''||x.done)&&!await askConfirm('最后一组已有记录，确认删除这一组吗？'))break;e.sets.pop();persist();renderTraining();break}case'copy-last':{const p=previous(e);if(!p)break;if((e.note||e.sets.some(x=>x.weight!==''||x.reps!==''||x.done))&&!await askConfirm('复制上次会替换当前动作的组内记录和备注，确认吗？'))break;e.sets=p.exercise.sets.map(x=>({weight:x.weight,reps:x.reps,done:false}));e.note=p.exercise.note;e.rir='';persist();renderTraining();notify('已复制，完成状态和余力已清空；请确认本次重量');break}case'add-cardio':if(!s)break;s.cardio.push({id:uid(),type:'',minutes:'',distance:'',note:''});persist();renderTraining();document.querySelector('.cardio:last-child')?.scrollIntoView({block:'center',behavior:'smooth'});break;case'remove-cardio':if(!await askConfirm('确认删除这个有氧项目及其记录吗？'))break;s.cardio.splice(+b.dataset.c,1);persist();renderTraining();break;case'add-exercise':{if(!s)break;const name=await askPrompt('填写要记录的动作名称（这不会改变原始训练计划）：');if(!name?.trim())break;const t=E('custom-'+uid(),name.trim().slice(0,300),3,'自定','自行记录目标肌群','额外项目用于记录，不代表建议增加训练量。陌生动作先请现场教练确认。',[],defaultBasis(name));s.exercises.push(newExercise(t));persist();renderTraining();document.querySelector('.exercise-list .card:last-child')?.scrollIntoView({block:'start',behavior:'smooth'});break}case'clear-filter':historyDate='';renderHistory();break;case'view-record':showRecord(b.dataset.id);break;case'edit-record':{const r=db.sessions.find(x=>x.id===b.dataset.id);if(!r)break;if(hasContent(db.draft)&&!await askConfirm('编辑历史会替换当前草稿，建议先结束当前训练或导出备份。继续吗？'))break;db.draft=clone(r);db.draft.status='draft';db.draft.editingId=r.id;$('#recordDialog').close();persist();setView('training');break}case'delete-record':{if(!await askConfirm('确认永久删除这次历史训练？建议先导出备份。'))break;db.sessions=db.sessions.filter(x=>x.id!==b.dataset.id);if(db.draft?.editingId===b.dataset.id)db.draft.editingId=null;persist();renderHistory();break}case'export-json':exportJSON();break;case'export-csv':exportCSV();break;case'export-raw':download(`训练手记原存储_${today()}.txt`,rawBackup||lastWritten,'text/plain');break;case'retry-save':if(persist())notify('已恢复本机保存');break;case'reload-storage':if(await askConfirm('请先导出当前记录。重新载入将读取其他标签页或原有存储，未保存的本页改动会丢失。确认重新载入？'))location.reload();break;case'download-html':{const html='<!doctype html>\n'+INITIAL_HTML;download('训练手记.html',html,'text/html;charset=utf-8');notify('已生成HTML；记录不包含在HTML中，请另导出JSON');break}}});
window.addEventListener('storage',event=>{if(event.key!==KEY||event.newValue===lastWritten)return;storageLocked=true;storageError='另一标签页修改了记录，已暂停本页保存，避免互相覆盖。请先导出本页，再重新载入。';updateStorageAlert()});
const INITIAL_HTML=document.documentElement.outerHTML;
setView('training');persist();updateStorageAlert();
</script>
